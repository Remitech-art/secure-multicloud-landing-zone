name: Security Scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  terraform-checks:
    name: Terraform Security Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        working-directory: ['terraform/aws', 'terraform/azure', 'terraform/gcp']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform fmt
        working-directory: ${{ matrix.working-directory }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ matrix.working-directory }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ matrix.working-directory }}
        run: terraform validate

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1
        with:
          tfsec_args: --format sarif
          directory: ${{ matrix.working-directory }}

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ matrix.working-directory }}
          framework: terraform

  dependency-scan:
    name: Dependency and Secret Scanning
    runs-on: ubuntu-latest
    needs: terraform-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run dependency review
        uses: actions/dependency-review-action@v3

      - name: GitHub secret scanning
        run: |
          echo "Secret scanning is performed by GitHub Advanced Security. Ensure secrets are not committed."
      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: tfsec.sarif
