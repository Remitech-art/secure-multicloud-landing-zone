name: Production Gates

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.5.0"

jobs:
  validate-and-scan:
    name: Validate and Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Run terraform fmt
        run: |
          terraform -version || true
          for d in terraform/aws terraform/azure terraform/gcp; do
            (cd $d && terraform fmt -check -recursive)
          done

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1
        with:
          directory: terraform

      - name: Run Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov
          checkov -d terraform --quiet

  hold-for-approval:
    name: Manual Approval for Deploy
    runs-on: ubuntu-latest
    needs: validate-and-scan
    environment: production
    steps:
      - name: Await manual approval
        run: echo "Manual approval granted by environment protection."
