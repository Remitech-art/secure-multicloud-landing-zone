apiVersion: v1
kind: ServiceAccount
metadata:
  name: gke-app-runner
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gke-app-viewer
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gke-app-viewer-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: gke-app-runner
    namespace: production
roleRef:
  kind: Role
  name: gke-app-viewer
  apiGroup: rbac.authorization.k8s.io
