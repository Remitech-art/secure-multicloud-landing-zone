apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gke-app-network-policy
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: frontend
      ports:
        - protocol: TCP
          port: 443
  egress:
    - to:
        - ipBlock:
            cidr: 10.2.0.0/16
      ports:
        - protocol: TCP
          port: 443
