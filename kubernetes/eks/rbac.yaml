apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-runner
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-readonly
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-readonly-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: app-runner
    namespace: production
roleRef:
  kind: Role
  name: app-readonly
  apiGroup: rbac.authorization.k8s.io
